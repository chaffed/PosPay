services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pospay
      POSTGRES_PASSWORD: pospay
      POSTGRES_DB: pospay
    ports:
      - "5432:5432"
    volumes:
      - pospay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pospay"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSPAY_DATABASE_URL: postgresql+psycopg://pospay:pospay@postgres:5432/pospay
      POSPAY_JWT_SECRET_KEY: change-me-in-production-to-a-random-32-byte-value
    ports:
      - "8000:8000"

volumes:
  pospay_postgres_data:
