{% extends "base.html" %}
{% block title %}New ACH Authorization — PosPay{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>New ACH authorization</h1>
  {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/ach/authorizations">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Account
      <select name="account_id" required>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }} ({{ a.account_number }})</option>{% endfor %}
      </select>
    </label>
    <label>Originator (company) ID <input type="text" name="originator_id" required></label>
    <label>Originator name <input type="text" name="originator_name" required></label>
    <label>Receiver ID (optional — leave blank to authorize any receiver for this originator)
      <input type="text" name="receiver_id"></label>
    <label>Max amount (optional) <input type="text" name="max_amount" placeholder="0.00"></label>
    <label>Frequency limit per 30 days (optional) <input type="number" name="frequency_limit" min="1"></label>
    <label>Allowed SEC codes, comma-separated (optional, e.g. PPD,WEB) <input type="text" name="allowed_sec_codes"></label>
    <label>Effective date <input type="date" name="effective_date" required></label>
    <label>Expiration date (optional) <input type="date" name="expiration_date"></label>
    <button type="submit">Create</button>
  </form>
</div>
{% endblock %}
