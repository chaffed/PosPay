{% extends "base.html" %}
{% block title %}Log in — PosPay{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>PosPay</h1>
  {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_path or '' }}">
    <label>
      Organization slug
      <input type="text" name="tenant_slug" value="{{ tenant_slug or '' }}" required autofocus>
    </label>
    <label>
      Email
      <input type="email" name="email" value="{{ email or '' }}" required>
    </label>
    <label>
      Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
