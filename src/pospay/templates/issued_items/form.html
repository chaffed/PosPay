{% extends "base.html" %}
{% block title %}New Issued Item — {{ ctx.tenant_name }}{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>New issued item</h1>
  {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/issued-items">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Account
      <select name="account_id" required>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }} ({{ a.account_number }})</option>{% endfor %}
      </select>
    </label>
    <label>Check number <input type="text" name="check_number" required></label>
    <label>Amount <input type="text" name="amount" placeholder="0.00" required></label>
    <label>Payee name <input type="text" name="payee_name" required></label>
    <label>Issue date <input type="date" name="issue_date" required></label>
    <button type="submit">Create</button>
  </form>
</div>
{% endblock %}
