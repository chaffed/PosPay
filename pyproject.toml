[project]
name = "pospay"
version = "0.1.0"
description = "Multi-tenant, multi-network positive pay platform (checks, ACH) with pluggable OCR and ML-assisted exception review."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "webauthn>=3.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "apscheduler>=3.10",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "joblib>=1.4",
  "pytesseract>=0.3.10",
  "pillow>=10.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mssql = ["pyodbc>=5.1"]
opencv = ["opencv-python-headless>=4.10"]
textract = ["boto3>=1.34"]
azure-di = ["azure-ai-documentintelligence>=1.0"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "factory-boy>=3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pospay = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
